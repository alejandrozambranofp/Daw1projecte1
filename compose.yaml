services:
  db:
    image: mysql:latest
    container_name: mysqldb
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: alejandro_db1
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  web:
    image: php:8.2-apache
    container_name: phpweb
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html

volumes:
  mysql-data: